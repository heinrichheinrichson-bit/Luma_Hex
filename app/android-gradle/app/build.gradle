plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = System.getenv('HEXJOY_SIGNING_PROPERTIES')
if (!signingFile) throw new GradleException('HEXJOY_SIGNING_PROPERTIES is required; never use a debug key for this AAB.')
file(signingFile).withInputStream { signing.load(it) }
android {
    namespace 'com.heinrichheinrichson.hexandjoy'
    compileSdk 36
    defaultConfig {
        applicationId 'com.heinrichheinrichson.hexandjoy'
        minSdk 30
        targetSdk 36
        versionCode 66
        versionName '0.31.1'
    }
    signingConfigs { upload {
        storeFile file(signing.getProperty('storeFile'))
        storePassword signing.getProperty('storePassword')
        keyAlias signing.getProperty('keyAlias')
        keyPassword signing.getProperty('keyPassword')
    } }
    buildTypes { release { signingConfig signingConfigs.upload; minifyEnabled false; debuggable false } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { implementation 'com.google.android.gms:play-services-ads:25.5.0' }
