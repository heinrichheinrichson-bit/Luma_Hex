<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Hex · Gesamtentwurf</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ecec;color:#304b56;font:14px system-ui;padding:24px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.6;margin:0 0 20px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;max-width:1740px;margin:auto}figure{margin:0}figcaption{font-weight:650;margin-bottom:12px}img{width:100%;display:block}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button{font:inherit;border:1px solid #b4c4c9;border-radius:10px;background:#fff;padding:10px 16px;color:#304b56;cursor:pointer}button[aria-pressed=true]{background:#193746;color:white}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){body{padding:16px}main{display:block;max-width:390px}figure{margin-bottom:28px}figure[hidden]{display:none}}</style><h1>Luma Hex · Gesamtentwurf 04</h1><p>Vier zusammengehörige Ansichten. Gestaltungsentwurf mit Beispielstand; kein spielbarer App-Build.</p><nav><button data-view="0" aria-pressed="true">Einstieg</button><button data-view="1" aria-pressed="false">Reise</button><button data-view="2" aria-pressed="false">Spiel</button><button data-view="3" aria-pressed="false">Abschluss</button></nav><main><figure data-screen="0"><figcaption>Einstieg</figcaption><img src="Einstieg.svg" alt="Einstieg – Luma Hex"></figure><figure data-screen="1"><figcaption>Reise</figcaption><img src="Reise.svg" alt="Reise – Luma Hex"></figure><figure data-screen="2"><figcaption>Spiel</figcaption><img src="Spiel.svg" alt="Spiel – Luma Hex"></figure><figure data-screen="3"><figcaption>Abschluss</figcaption><img src="Abschluss.svg" alt="Abschluss – Luma Hex"></figure></main><script>let selected=0;function update(){const mobile=matchMedia('(max-width:550px)').matches;document.querySelectorAll('figure').forEach((e,i)=>e.hidden=mobile&&i!==selected);document.querySelectorAll('button').forEach((e,i)=>e.setAttribute('aria-pressed',i===selected))}document.querySelector('nav').onclick=e=>{if(e.target.dataset.view!==undefined){selected=+e.target.dataset.view;update()}};addEventListener('resize',update);update()</script></html>
